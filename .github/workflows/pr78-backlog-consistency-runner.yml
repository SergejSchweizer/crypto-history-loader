name: pr78-backlog-consistency-runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/pr78-postgres-temporal-conformance-plan' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr78-postgres-temporal-conformance-plan
          fetch-depth: 0
      - name: Execute consistency patch and clean temporary workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr78-backlog-consistency-patch.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = []
          for line in lines[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              script_lines.append(line)
          exec(compile('\n'.join(script_lines) + '\n', '<pr78-consistency-patch>', 'exec'), {'__name__': '__main__'})
          PY
          rm -f .github/workflows/pr78-backlog-consistency-patch.yml
          rm -f .github/workflows/pr78-backlog-consistency-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(PR-78): correct audit backlog dependencies"
          git push origin HEAD:codex/pr78-postgres-temporal-conformance-plan
