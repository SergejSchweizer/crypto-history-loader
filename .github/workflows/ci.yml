name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pyright
        run: uv run pyright --level error

      - name: Ty
        run: uv run ty check .

      - name: Import architecture checks
        run: uv run lint-imports --config .importlinter

      - name: Validate config schema
        run: uv run python scripts/validate_config_with_pydantic.py --config config.yaml

      - name: Pytest
        run: uv run --extra dev pytest
