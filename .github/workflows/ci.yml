name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_SHARD_COUNT: 4

jobs:
  pr-static-quality:
    name: pr-static-quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pyright
        run: uv run pyright --level error

      - name: Ty
        run: uv run ty check .

      - name: Import architecture checks
        run: uv run lint-imports --config .importlinter

      - name: Validate config schema
        run: uv run python scripts/validate_config_with_pydantic.py --config config.yaml

      - name: Validate README inventory
        run: uv run python scripts/validate_readme_inventory.py

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/validate_conventional_commit.py --title "$PR_TITLE"

  pr-pytest-shard:
    name: pr-pytest-shard-${{ matrix.shard }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Pytest shard
        run: >
          uv run --extra dev python scripts/pytest_shard.py
          --shard-index ${{ matrix.shard }}
          --shard-count ${PYTEST_SHARD_COUNT}
          --
          -o addopts= -q -n logical --maxprocesses=4 --dist=loadscope --no-cov

  pr-quality:
    name: pr-quality
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - pr-static-quality
      - pr-pytest-shard

    steps:
      - name: Verify PR quality gates
        run: |
          if [[ "${{ needs.pr-static-quality.result }}" != "success" ]]; then
            echo "pr-static-quality result: ${{ needs.pr-static-quality.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.pr-pytest-shard.result }}" != "success" ]]; then
            echo "pr-pytest-shard result: ${{ needs.pr-pytest-shard.result }}" >&2
            exit 1
          fi
          echo "pr-quality passed: static gates and pytest shards succeeded"

  main-static-quality:
    name: main-static-quality
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pyright
        run: uv run pyright --level error

      - name: Ty
        run: uv run ty check .

      - name: Import architecture checks
        run: uv run lint-imports --config .importlinter

      - name: Validate config schema
        run: uv run python scripts/validate_config_with_pydantic.py --config config.yaml

      - name: Validate README inventory
        run: uv run python scripts/validate_readme_inventory.py

      - name: Validate latest commit title
        run: uv run python scripts/validate_conventional_commit.py --latest

  main-pytest-shard:
    name: main-pytest-shard-${{ matrix.shard }}
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Pytest shard with coverage
        run: >
          uv run --extra dev python scripts/pytest_shard.py
          --shard-index ${{ matrix.shard }}
          --shard-count ${PYTEST_SHARD_COUNT}
          --
          -o addopts= -q -n logical --maxprocesses=4 --dist=loadscope
          --cov=application --cov=ingestion --cov=api --cov-report=

      - name: Prepare coverage artifact
        run: |
          mkdir -p coverage-artifacts
          cp .coverage coverage-artifacts/.coverage.${{ matrix.shard }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-artifacts/
          if-no-files-found: error
          include-hidden-files: true

  main-quality:
    name: main-quality
    if: always() && (github.event_name == 'push' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    needs:
      - main-static-quality
      - main-pytest-shard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify main quality dependencies
        run: |
          if [[ "${{ needs.main-static-quality.result }}" != "success" ]]; then
            echo "main-static-quality result: ${{ needs.main-static-quality.result }}" >&2
            exit 1
          fi
          if [[ "${{ needs.main-pytest-shard.result }}" != "success" ]]; then
            echo "main-pytest-shard result: ${{ needs.main-pytest-shard.result }}" >&2
            exit 1
          fi

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          path: coverage-shards
          merge-multiple: true

      - name: Coverage report
        run: |
          uv run coverage combine coverage-shards
          uv run coverage report
