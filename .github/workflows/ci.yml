name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-quality:
    name: pr-quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pyright
        run: uv run pyright --level error

      - name: Ty
        run: uv run ty check .

      - name: Import architecture checks
        run: uv run lint-imports --config .importlinter

      - name: Validate config schema
        run: uv run python scripts/validate_config_with_pydantic.py --config config.yaml

      - name: Validate README inventory
        run: uv run python scripts/validate_readme_inventory.py

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python scripts/validate_conventional_commit.py --title "$PR_TITLE"

      - name: Pytest
        run: uv run --extra dev pytest -q

  main-quality:
    name: main-quality
    if: github.event_name == 'push' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pyright
        run: uv run pyright --level error

      - name: Ty
        run: uv run ty check .

      - name: Import architecture checks
        run: uv run lint-imports --config .importlinter

      - name: Validate config schema
        run: uv run python scripts/validate_config_with_pydantic.py --config config.yaml

      - name: Validate README inventory
        run: uv run python scripts/validate_readme_inventory.py

      - name: Validate latest commit title
        run: uv run python scripts/validate_conventional_commit.py --latest

      - name: Pytest with coverage
        run: uv run --extra dev pytest --cov --cov-report=term-missing
