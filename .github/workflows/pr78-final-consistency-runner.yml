name: pr78-final-consistency-runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/pr78-postgres-temporal-conformance-plan' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr78-postgres-temporal-conformance-plan
          fetch-depth: 0
      - name: Execute final consistency patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr78-final-consistency-patch.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          start = lines.index('# PATCH_START') + 1
          end = lines.index('# PATCH_END')
          script_lines = []
          for line in lines[start:end]:
              if line == '#':
                  script_lines.append('')
              elif line.startswith('# '):
                  script_lines.append(line[2:])
              else:
                  raise SystemExit(f'unexpected staged patch line: {line!r}')
          exec(compile('\n'.join(script_lines) + '\n', '<pr78-final-consistency>', 'exec'), {'__name__': '__main__'})
          PY
          rm -f .github/workflows/pr78-final-consistency-patch.yml
          rm -f .github/workflows/pr78-final-consistency-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(PR-78): make recovery evidence driven"
          git push origin HEAD:codex/pr78-postgres-temporal-conformance-plan
