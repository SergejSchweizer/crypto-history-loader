name: pr78-audit-backlog-patch-runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/pr78-postgres-temporal-conformance-plan' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr78-postgres-temporal-conformance-plan
          fetch-depth: 0
      - name: Execute staged audit patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr78-audit-backlog-patch.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = []
          for line in lines[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              script_lines.append(line)
          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, '<pr78-audit-backlog-patch>', 'exec'), {'__name__': '__main__'})
          PY
          python -m pip install --disable-pip-version-check --quiet ruff==0.16.4
          python -m ruff format tests/test_postgres_gold_repository.py tests/test_cli_lock.py
          rm -f .github/workflows/pr78-audit-backlog-patch.yml
          rm -f .github/workflows/pr78-audit-backlog-patch-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(PR-78): expand repository audit corrective backlog"
          git push origin HEAD:codex/pr78-postgres-temporal-conformance-plan
