global:
  deribit_observed_start_dates:
    spot_ohlcv:
      BTC: "2023-04-24"
      ETH: "2023-04-24"
      SOL: "2024-02-27"
    volatility_index_data:
      BTC: "2021-04-01"
      ETH: "2021-04-01"
env:
  DEPTH_SYNC_LOG_DIR: .logs
  DEPTH_FETCH_CONCURRENCY: 6
  DEPTH_DERIBIT_PERP_TRADES_PAGE_SIZE: 1000
  DEPTH_DERIBIT_OPTION_TRADES_PAGE_SIZE: 1000
  DEPTH_DERIBIT_PERP_TRADES_INTER_REQUEST_SLEEP_S: 0.02
  DEPTH_DERIBIT_OPTION_TRADES_INTER_REQUEST_SLEEP_S: 0.02
  DEPTH_PERP_TRADES_WINDOW_MINUTES: 60
export-descriptive-stats:
  lake_root: lake/bronze
  output_csv: docs/tables/descriptive_stats.csv
  start_time: "2026-01-01T00:00:00+00:00"
  end_time: "2026-01-31T23:59:59+00:00"
  exchanges: [deribit]
  symbols: [BTC, ETH, SOL]
  timeframes: [1m]
  instrument_types: [spot_ohlcv, perp]

bronze-build:
  exchange: deribit
  dataset: [spot_ohlcv, peprs_ohlcv, oi, funding, perps_trades, option_trades]
  start_date: "2018-08-14"
  symbol_start_dates:
    - BTC=2018-08-14
    - ETH=2019-03-14
    - SOL=2022-03-15
  symbols: [BTC, ETH, SOL]
  save_parquet_lake: true
  no_json_output: true

medallion-pipeline:
  execution_order: [bronze, silver, gold]
  bronze:
    enabled: true
    command: bronze-build
    cli_args:
      - --exchanges
      - deribit
      - --dataset
      - spot_ohlcv
      - peprs_ohlcv
      - oi
      - funding
      - perps_trades
      - option_trades
      - --symbols
      - BTC
      - ETH
      - SOL
      - --save-parquet-lake
      - --no-json-output
  silver:
    enabled: true
    command: silver-build
    cli_args:
      - --dataset
      - spot_ohlcv
      - peprs_ohlcv
      - funding
      - oi
      - perps_trades
      - option_trades
      - --manifest
      - --plot
      - --maxprocesses
      - "4"
      - --no-json-output
  gold:
    enabled: true
    command: gold-build
    cli_args:
      - --manifest
      - --plot
      - --maxprocesses
      - "4"
      - --no-json-output
