env:
  DEPTH_SYNC_LOG_DIR: .logs
  DEPTH_FETCH_CONCURRENCY: 6
  POLARS_MAX_THREADS: 4
  DEPTH_DERIBIT_PERP_TRADES_PAGE_SIZE: 1000
  DEPTH_DERIBIT_OPTIONS_TRADES_PAGE_SIZE: 1000
  DEPTH_DERIBIT_PERP_TRADES_INTER_REQUEST_SLEEP_S: 0.02
  DEPTH_DERIBIT_OPTIONS_TRADES_INTER_REQUEST_SLEEP_S: 0.02
  DEPTH_PERP_TRADES_WINDOW_MINUTES: 60
  PGHOST: 10.10.1.3
  PGPORT: 54321
  PGUSER: crypto-loader
  PGDATABASE: postgres
  PGPASSWORD: "<set-in-local-config.yaml>"
export-descriptive-stats:
  lake_root: lake/bronze
  output_csv: docs/tables/descriptive_stats.csv
  start_time: "2026-01-01T00:00:00+00:00"
  end_time: "2026-01-31T23:59:59+00:00"
  exchanges: [deribit]
  symbols: [BTC, ETH, SOL]
  timeframes: [1m]
  instrument_types: [spot_ohlcv, perp]

bronze-build:
  exchange: deribit
  dataset: [spot_ohlcv, perps_ohlcv, open_interest, funding, perps_trades, options_trades, volatility_index_data]
  symbol_start_dates:
    - BTC=2018-08-14
    - ETH=2019-03-14
    - SOL=2022-03-15
  symbols: [BTC, ETH, SOL]
  save_parquet_lake: true
  no_json_output: true

medallion-pipeline:
  execution_order: [bronze, silver, gold]
  reuse-existing-inputs:
    enabled: false
    max_age_seconds: 86400
    bronze_root: lake/bronze
    silver_root: lake/silver
  bronze:
    enabled: true
    command: bronze-build
    cli_args:
      - --exchanges
      - deribit
      - --dataset
      - spot_ohlcv
      - perps_ohlcv
      - open_interest
      - funding
      - perps_trades
      - options_trades
      - volatility_index_data
      - --symbols
      - BTC
      - ETH
      - SOL
      - --save-parquet-lake
      - --tail-delta-only
      - --no-json-output
  silver:
    enabled: true
    command: silver-build
    cli_args:
      - --dataset
      - spot_ohlcv
      - perps_ohlcv
      - funding
      - open_interest
      - perps_trades
      - options_trades
      - volatility_index_data
      - volatility_index_snapshot_1m
      - realized_volatility
      - iv_rv
      - index_price_snapshot_1m
      - futures_summary_snapshot_1m
      - options_ticker_snapshot_1m
      - options_instrument_ticker_snapshot_1m
      - options_surface_1m_feature
      - perps_l2_snapshot_1m
      - options_l2_snapshot_1m
      - recent_trade_snapshot_1m
      - instrument_metadata_snapshot_daily
      - futures_instrument_metadata_snapshot_daily
      - historical_volatility
      - --manifest
      - --maxprocesses
      - "4"
      - --no-json-output
  gold:
    enabled: true
    command: gold-build
    cli_args:
      - --exclude-dataset-id
      - gold.history.extended.m1
      - gold.history.extended.m5
      - gold.history.extended.m30
      - gold.history.extended.h1
      - gold.history.extended_full.m1
      - --manifest
      - --plot
      - --maxprocesses
      - "4"
      - --no-json-output
